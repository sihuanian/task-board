<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务看板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Error banner (hidden by default) -->
  <div id="error-banner" class="error-banner hidden" role="alert">
    <span id="error-banner-msg">存储已满或不可用，部分更改无法保存。</span>
    <button id="error-banner-close" aria-label="关闭">&times;</button>
  </div>

  <!-- Corruption dialog (hidden by default) -->
  <div id="corruption-overlay" class="overlay hidden">
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="corruption-title">
      <p id="corruption-title">已保存的数据无法读取，是否重新开始？</p>
      <p class="dialog-hint">（保存时会覆盖旧数据。）</p>
      <div class="dialog-actions">
        <button id="corruption-start-fresh" class="btn btn-primary">重新开始</button>
        <button id="corruption-cancel" class="btn btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <h1 class="app-title">任务看板</h1>
    <div class="header-controls">
      <button id="export-btn" class="btn btn-icon" title="导出 JSON" aria-label="导出所有任务为 JSON">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button id="dark-toggle" class="btn btn-icon" title="切换深色模式" aria-label="切换深色模式">
        <svg id="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- Search bar -->
  <div class="search-bar">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="search-input" placeholder="搜索任务..." aria-label="按标题搜索任务">
  </div>

  <!-- Board -->
  <main id="board" class="board" role="application" aria-label="任务看板"></main>

  <!-- Snackbar for undo -->
  <div id="snackbar" class="snackbar hidden" role="status" aria-live="polite">
    <span id="snackbar-msg">任务已删除。</span>
    <button id="snackbar-undo" class="btn btn-text">撤销</button>
  </div>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
